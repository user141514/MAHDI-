name: mahdi

services:
  app:
    image: mahdi:${MAHDI_IMAGE_TAG:?Set MAHDI_IMAGE_TAG in .env}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "0.0.0.0:8901:8010"
    env_file:
      - .env
    environment:
      MAHDI_ENV: production
    volumes:
      - ./data:/app/backend/data
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    shm_size: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
